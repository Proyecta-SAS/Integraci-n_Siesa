<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Avanzar | Activadores Siesa</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="launcher" aria-label="Activadores Sistemas Contables Siesa">
      <section class="launcher-panel">
        <div class="logo-frame">
          <img src="./assets/avanzar-logo-color.svg" alt="Avanzar">
        </div>

        <div class="title-block">
          <h1>Activadores Sistemas Contables Siesa</h1>
          <span aria-hidden="true"></span>
        </div>

        <nav class="activator-grid" aria-label="Activadores Siesa">
          <button class="activator-button" type="button" data-company="antiguo">
            Siesa Antiguo
          </button>
          <button class="activator-button" type="button" data-company="lidera">
            Siesa Lidera
          </button>
          <button class="activator-button active" type="button" data-company="alianza">
            Siesa Alianza
          </button>
          <button class="activator-button" type="button" data-company="prosperar">
            Siesa Prosperar
          </button>
        </nav>

        <section class="status-panel" aria-live="polite">
          <div>
            <span class="status-label">Modulo activo</span>
            <strong id="selectedCompany">Siesa Alianza</strong>
          </div>
          <div>
            <span class="status-label">Fuente</span>
            <strong>Google Sheets / Ingreso - Egreso</strong>
          </div>
          <div>
            <span class="status-label">Destino</span>
            <strong>Recibos de caja / Clientes</strong>
          </div>
          <div>
            <span class="status-label">Conector</span>
            <strong>142888 - API_v1_ReciboCaja</strong>
          </div>
        </section>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
